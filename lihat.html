<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistem Monitoring & Rekap Absensi Siswa</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      background: #f4f6f9;
      color: #333;
      margin: 0;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { margin-top: 0; color: #1e293b; font-size: 24px; }
    
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    label { font-weight: 600; color: #475569; }
    select, button {
      padding: 10px 16px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
    }
    select { min-width: 220px; background: white; cursor: pointer; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 16px;
      text-align: center;
    }
    .stat-card .val { font-size: 22px; font-weight: 700; color: #0f172a; }
    .stat-card .lbl { font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 600; margin-top: 4px; }

    /* Tabs */
    .view-tabs {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-top: 20px;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: none;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: #2563eb;
      border-bottom-color: #2563eb;
    }

    /* Tables */
    .table-container { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
    th { background: #f1f5f9; font-weight: 600; color: #334155; }
    tr:nth-child(even) { background-color: #f8fafc; }
    
    /* Badges Status Kehadiran */
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }
    .badge-hadir { background: #dcfce7; color: #166534; }
    .badge-sakit { background: #fef9c3; color: #854d0e; }
    .badge-izin { background: #e0f2fe; color: #075985; }
    .badge-alpa, .badge-tanpa-keterangan { background: #fee2e2; color: #991b1b; }

    .muted { color: #64748b; font-size: 14px; }
    .loading { color: #2563eb; font-weight: 600; }
    .error { color: #dc2626; font-weight: 600; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Rekapitulasi & Detail Absensi Siswa</h1>

    <div class="card">
      <div class="controls">
        <label for="sheetSelect">Pilih Kelas / Sheet:</label>
        <select id="sheetSelect">
          <option value="">-- Memuat Daftar Sheet... --</option>
        </select>
        <button id="refreshBtn">Refresh Data</button>
      </div>
    </div>

    <div id="contentArea" class="card" style="display: none;">
      <h2 id="sheetTitle" style="margin-top: 0; color: #1e293b;"></h2>
      
      <!-- Card Statistik -->
      <div id="statGrid" class="stat-grid"></div>

      <!-- Tab Navigasi View -->
      <div class="view-tabs">
        <button class="tab-btn active" onclick="switchView('rekap')">Rekap Per Siswa</button>
        <button class="tab-btn" onclick="switchView('log')">Log Semua Absensi</button>
      </div>

      <!-- Area Tabel Rekap -->
      <div id="rekapView" class="table-container"></div>

      <!-- Area Tabel Log Absensi Lengkap -->
      <div id="logView" class="table-container" style="display: none;"></div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '1foU4hKjM2QgOqsJbhEZYrjciVamT7LP8-YdUjPeVPfs';
    
    // Daftar sheet sesuai data spreadsheet Anda
    const KNOWN_SHEETS = [
      'Siswa',
      'XI TKJ 3',
      'XI TKJ 2',
      'XII TKJ 3',
      'XII TKJ 2',
      '11 TKJ 3 salinan',
      'XI TKJ 4'
    ];

    let currentSheetData = null;

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, function(s) { 
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]); 
      });
    }

    // Ambil data sheet via Google Visualization API JSON Endpoint
    async function fetchSheetData(sheetName) {
      const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`Gagal memuat data dari sheet "${sheetName}". Status: ${res.status}`);
      
      const text = await res.text();
      const firstBrace = text.indexOf('{');
      const lastBrace = text.lastIndexOf('}');
      if (firstBrace === -1 || lastBrace === -1) throw new Error('Respon data dari Google Sheets tidak valid.');

      const json = JSON.parse(text.slice(firstBrace, lastBrace + 1));
      if (json.status === 'error') {
        throw new Error(json.errors[0]?.detailed_message || 'Terjadi kesalahan saat membaca sheet.');
      }

      const table = json.table;
      const headers = (table.cols || []).map(c => (c.label || c.id || '').trim());
      const rows = (table.rows || []).map(r => {
        return (r.c || []).map(cell => {
          if (!cell) return '';
          return cell.f !== undefined ? cell.f : (cell.v !== null && cell.v !== undefined ? cell.v : '');
        });
      });

      return { headers, rows };
    }

    // Deteksi otomatis kolom Nama, Status Kehadiran, dan Tanggal/Waktu
    function detectColumns(headers) {
      const findIdx = (regex) => headers.findIndex(h => regex.test(h));

      let nameIdx = findIdx(/nama/i);
      let statusIdx = findIdx(/status|keterangan|ket|absensi|kehadiran/i);
      let dateIdx = findIdx(/tanggal|waktu|timestamp|tgl/i);

      return {
        nameIdx: nameIdx >= 0 ? nameIdx : 1,
        statusIdx: statusIdx >= 0 ? statusIdx : 2,
        dateIdx: dateIdx >= 0 ? dateIdx : 0
      };
    }

    // Render Ringkasan Total Status Kehadiran
    function renderStats(totals) {
      const statGrid = document.getElementById('statGrid');
      statGrid.innerHTML = '';

      const keys = Object.keys(totals);
      if (keys.length === 0) return;

      let totalRecords = 0;
      keys.forEach(k => totalRecords += totals[k]);

      // Card Total
      let html = `
        <div class="stat-card">
          <div class="val">${totalRecords}</div>
          <div class="lbl">Total Catatan</div>
        </div>
      `;

      keys.forEach(k => {
        html += `
          <div class="stat-card">
            <div class="val">${totals[k]}</div>
            <div class="lbl">${escapeHtml(k)}</div>
          </div>
        `;
      });

      statGrid.innerHTML = html;
    }

    // Render Tabel Rekapitulasi per Siswa
    function renderRekapTable(rows, cols) {
      const rekapView = document.getElementById('rekapView');
      const perStudent = new Map();
      const totals = {};

      rows.forEach(r => {
        if (!r || r.length === 0) return;
        const name = String(r[cols.nameIdx] || '').trim();
        let status = String(r[cols.statusIdx] || '').trim().toLowerCase();

        if (!name) return;
        if (!status) status = 'hadir';

        if (!perStudent.has(name)) perStudent.set(name, {});
        const st = perStudent.get(name);
        st[status] = (st[status] || 0) + 1;

        totals[status] = (totals[status] || 0) + 1;
      });

      renderStats(totals);

      const statusKeys = Object.keys(totals).sort();
      const sortedStudents = Array.from(perStudent.entries()).sort((a, b) => a[0].localeCompare(b[0]));

      if (sortedStudents.length === 0) {
        rekapView.innerHTML = '<p class="muted">Tidak ada data absensi yang ditemukan pada sheet ini.</p>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th style="width: 50px;">No</th>
              <th>Nama Siswa</th>
      `;
      statusKeys.forEach(s => {
        html += `<th style="text-transform: capitalize; text-align: center;">${escapeHtml(s)}</th>`;
      });
      html += `</tr></thead><tbody>`;

      sortedStudents.forEach(([studentName, counts], idx) => {
        html += `
          <tr>
            <td style="text-align: center;">${idx + 1}</td>
            <td><strong>${escapeHtml(studentName)}</strong></td>
        `;
        statusKeys.forEach(s => {
          const count = counts[s] || 0;
          html += `<td style="text-align: center;">${count > 0 ? count : '-'}</td>`;
        });
        html += `</tr>`;
      });

      html += `</tbody></table>`;
      rekapView.innerHTML = html;
    }

    // Render Log Data Asli / Semua Baris Absensi
    function renderLogTable(headers, rows) {
      const logView = document.getElementById('logView');
      
      if (!rows || rows.length === 0) {
        logView.innerHTML = '<p class="muted">Tidak ada log data absensi.</p>';
        return;
      }

      let html = `<table><thead><tr>`;
      headers.forEach(h => {
        html += `<th>${escapeHtml(h || 'Kolom')}</th>`;
      });
      html += `</tr></thead><tbody>`;

      rows.forEach(r => {
        html += `<tr>`;
        headers.forEach((_, colIdx) => {
          const val = String(r[colIdx] || '').trim();
          let cellContent = escapeHtml(val);

          // Beri badge warna pada status kehadiran
          const lowerVal = val.toLowerCase();
          if (['hadir', 'sakit', 'izin', 'alpa'].includes(lowerVal)) {
            cellContent = `<span class="badge badge-${lowerVal}">${escapeHtml(val)}</span>`;
          }

          html += `<td>${cellContent}</td>`;
        });
        html += `</tr>`;
      });

      html += `</tbody></table>`;
      logView.innerHTML = html;
    }

    // Tampilkan Sheet yang Dipilih
    async function loadSheet(sheetName) {
      const contentArea = document.getElementById('contentArea');
      const sheetTitle = document.getElementById('sheetTitle');
      const rekapView = document.getElementById('rekapView');
      const logView = document.getElementById('logView');

      if (!sheetName) {
        contentArea.style.display = 'none';
        return;
      }

      contentArea.style.display = 'block';
      sheetTitle.innerText = `Kelas / Sheet: ${sheetName}`;
      rekapView.innerHTML = '<p class="loading">Memuat data absensi...</p>';
      logView.innerHTML = '';
      document.getElementById('statGrid').innerHTML = '';

      try {
        const { headers, rows } = await fetchSheetData(sheetName);
        const cols = detectColumns(headers);

        renderRekapTable(rows, cols);
        renderLogTable(headers, rows);
      } catch (err) {
        console.error(err);
        rekapView.innerHTML = `<p class="error">Gagal menampilkan data: ${escapeHtml(err.message)}</p>`;
      }
    }

    // Switch Tab antara 'Rekap' dan 'Log'
    function switchView(view) {
      const rekapView = document.getElementById('rekapView');
      const logView = document.getElementById('logView');
      const tabs = document.querySelectorAll('.tab-btn');

      if (view === 'rekap') {
        rekapView.style.display = 'block';
        logView.style.display = 'none';
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
      } else {
        rekapView.style.display = 'none';
        logView.style.display = 'block';
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
      }
    }

    // Inisialisasi Pilihan Sheet
    function init() {
      const select = document.getElementById('sheetSelect');
      const refreshBtn = document.getElementById('refreshBtn');

      select.innerHTML = '<option value="">-- Pilih Kelas / Sheet --</option>' +
        KNOWN_SHEETS.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

      select.addEventListener('change', () => {
        loadSheet(select.value);
      });

      refreshBtn.addEventListener('click', () => {
        if (select.value) {
          loadSheet(select.value);
        } else {
          alert('Pilih kelas/sheet terlebih dahulu.');
        }
      });
    }

    init();
  </script>
</body>
</html>
