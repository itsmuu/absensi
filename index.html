<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hadirmu - Absensi Online TKJ</title>
  
  <!-- Font Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #4a90e2;
      --secondary-color: #f4f7f6;
      --text-color: #2c3e50;
      --bg-color: #e0e8f0;
      
      --color-h: #2ecc71;
      --color-i: #f1c40f;
      --color-s: #3498db;
      --color-a: #e74c3c;
    }

    * { box-sizing: border-box; }

    body { 
      font-family: 'Poppins', sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-color);
      margin: 0; 
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background-image: 
        radial-gradient(at 10% 20%, rgba(74, 144, 226, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(46, 204, 113, 0.08) 0px, transparent 50%);
    }

    /* ---------------------------------------------------- */
    /* NAVBAR STYLE RESPONSIF DENGAN MOBILE HAMBURGER MENU  */
    /* ---------------------------------------------------- */
    .navbar {
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.04);
      position: sticky;
      top: 0;
      z-index: 500;
      padding: 0 20px;
    }

    .navbar-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
      position: relative;
    }

    /* BRAND / LOGO */
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-color);
      font-weight: 600;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
    }

    .navbar-brand .logo-icon {
      width: 38px;
      height: 38px;
      background: #eef6ff;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 8px rgba(74, 144, 226, 0.12);
      border: 1px solid rgba(74, 144, 226, 0.15);
      flex-shrink: 0;
    }

    .navbar-brand .logo-icon svg {
      width: 22px;
      height: 22px;
      stroke: #0084ff;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .navbar-brand:hover .logo-icon {
      background: #e0f0ff;
      transform: scale(1.06);
    }

    .navbar-brand:hover .logo-icon svg {
      transform: rotate(90deg);
    }

    /* DESKTOP MENU */
    .navbar-menu {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .navbar-menu button {
      background: transparent;
      border: none;
      font-family: 'Poppins', sans-serif;
      color: #555;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 8px 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .navbar-menu button:hover {
      color: var(--primary-color);
      background: rgba(74, 144, 226, 0.08);
    }

    /* HAMBURGER TOGGLE BUTTON (HIDDEN IN DESKTOP) */
    .hamburger-btn {
      display: none;
      width: 40px;
      height: 40px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      border-radius: 10px;
      transition: background 0.2s ease;
    }

    .hamburger-btn:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    .hamburger-btn span {
      width: 22px;
      height: 2.5px;
      background-color: #333;
      border-radius: 2px;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      transform-origin: center;
    }

    /* ANIMASI HAMBURGER JADI SILANG (X) */
    .hamburger-btn.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .hamburger-btn.active span:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }

    .hamburger-btn.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* ---------------------------------------------------- */
    /* TAMPILAN KHUSUS MOBILE (HP)                         */
    /* ---------------------------------------------------- */
    @media (max-width: 576px) {
      .navbar {
        padding: 0 16px;
      }

      /* Sembunyikan Teks "Hadirmu" di Navbar pada HP */
      .navbar-brand span {
        display: none;
      }

      .hamburger-btn {
        display: flex; /* Tampilkan ikon 3 garis */
      }

      /* Dropdown Menu Mobile */
      .navbar-menu {
        position: absolute;
        top: 60px;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 12px 16px 16px 16px;
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-top: none;
        
        /* Animasi Pop-down */
        opacity: 0;
        visibility: hidden;
        transform: translateY(-15px) scale(0.98);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
      }

      /* Saat menu dibuka */
      .navbar-menu.open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: all;
      }

      .navbar-menu button {
        padding: 12px 16px;
        font-size: 14px;
        border-radius: 12px;
        justify-content: flex-start;
        background: rgba(0, 0, 0, 0.02);
      }

      .navbar-menu button:active {
        background: rgba(74, 144, 226, 0.12);
        color: var(--primary-color);
      }
    }

    /* Container Utama */
    .container { 
      width: calc(100% - 32px);
      max-width: 520px; 
      margin: 16px auto; 
      padding: 24px; 
      background: rgba(255, 255, 255, 0.75); 
      border-radius: 20px; 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .header-app {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header-app h2 { 
      margin: 0; 
      font-weight: 600; 
      color: var(--text-color);
      font-size: 24px;
    }
    
    .header-app p {
      margin: 4px 0 0;
      font-weight: 300;
      font-size: 13px;
      color: #7f8c8d;
    }

    label { 
      font-weight: 600; 
      font-size: 13px; 
      color: #555;
      display: block;
      margin-bottom: 8px;
    }

    /* CUSTOM DROPDOWN MODERN */
    .custom-select-wrapper {
      position: relative;
      user-select: none;
    }

    .custom-select-trigger {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 14px;
      border: 2px solid rgba(0,0,0,0.04);
      font-size: 14px;
      font-weight: 500;
      color: #333;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .custom-select-trigger:hover {
      background: #ffffff;
      border-color: rgba(74, 144, 226, 0.3);
    }

    .custom-select-trigger .arrow {
      width: 8px;
      height: 8px;
      border-right: 2px solid #666;
      border-bottom: 2px solid #666;
      transform: rotate(45deg);
      transition: transform 0.3s ease;
      margin-bottom: 2px;
    }

    .custom-select-wrapper.open .custom-select-trigger .arrow {
      transform: rotate(-135deg);
      margin-bottom: -2px;
    }

    .custom-options {
      position: absolute;
      display: block;
      top: 100%;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      margin-top: 6px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      max-height: 220px;
      overflow-y: auto;
      padding: 6px;
    }

    .custom-select-wrapper.open .custom-options {
      opacity: 1;
      visibility: visible;
      pointer-events: all;
      transform: translateY(0);
    }

    .custom-option {
      padding: 10px 14px;
      font-size: 13.5px;
      font-weight: 500;
      color: #444;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
      margin-bottom: 2px;
    }

    .custom-option:hover {
      background-color: rgba(74, 144, 226, 0.1);
      color: var(--primary-color);
    }

    .custom-option.selected {
      background-color: var(--primary-color);
      color: white;
    }

    #daftarSiswa { margin-top: 20px; }

    .daftar-header {
      font-weight: 600;
      color: var(--text-color);
      border-bottom: 2px solid rgba(0,0,0,0.05);
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .siswa-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 10px 12px; 
      background: rgba(255,255,255,0.6);
      border-radius: 12px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .nama-siswa-wrapper {
      flex: 1;
      padding-right: 8px;
      overflow: hidden;
    }

    .nama-siswa-text { 
      font-size: 13.5px; 
      font-weight: 500;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .status-group { 
      display: flex;
      gap: 4px; 
      flex-shrink: 0;
    }

    .status-group input[type="radio"] { display: none; }

    .status-group label {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      margin: 0;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      color: #777; 
      background-color: #edf2f4; 
    }

    .status-group input[value="Hadir"]:checked + label {
      background-color: rgba(46, 204, 113, 0.15);
      color: var(--color-h);
      border-color: var(--color-h);
    }

    .status-group input[value="Izin"]:checked + label {
      background-color: rgba(241, 196, 15, 0.15);
      color: var(--color-i);
      border-color: var(--color-i);
    }

    .status-group input[value="Sakit"]:checked + label {
      background-color: rgba(52, 152, 219, 0.15);
      color: var(--color-s);
      border-color: var(--color-s);
    }

    .status-group input[value="Alpha"]:checked + label {
      background-color: rgba(231, 76, 60, 0.15);
      color: var(--color-a);
      border-color: var(--color-a);
    }

    .btn-simpan { 
      width: 100%; 
      padding: 12px; 
      margin-top: 20px; 
      border-radius: 12px; 
      background: linear-gradient(135deg, var(--primary-color) 0%, #357abd 100%);
      color: white; 
      font-weight: 600; 
      font-size: 14.5px;
      font-family: 'Poppins', sans-serif;
      border: none; 
      cursor: pointer; 
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
    }

    #loading { 
      display: none; 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(5px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    
    .spinner {
      border: 3px solid rgba(0,0,0,0.1);
      border-left-color: var(--primary-color);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* MODAL PASSWORD */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-box {
      background: white;
      padding: 20px;
      border-radius: 18px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      text-align: center;
    }

    .modal-box h3 { margin: 0 0 6px; font-size: 17px; color: var(--text-color); }
    .modal-box p { font-size: 12.5px; color: #666; margin-bottom: 14px; }

    .input-password {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      outline: none;
      margin-bottom: 14px;
    }

    .modal-actions { display: flex; gap: 8px; }

    .btn-modal {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
    }

    .btn-cancel { background: #edf2f4; color: #555; }
    .btn-submit { background: var(--primary-color); color: white; }
  </style>
</head>
<body>

<!-- NAVBAR HEADER -->
<nav class="navbar">
  <div class="navbar-container">
    <!-- LOGO (KLIK KE ITSMUU.GITHUB.IO) -->
    <div class="navbar-brand" onclick="goDashboard()">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="7" height="7" rx="2.5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="14" y="3" width="7" height="7" rx="2.5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="14" y="14" width="7" height="7" rx="2.5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="3" y="14" width="7" height="7" rx="2.5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span>Hadirmu</span>
    </div>

    <!-- TOMBOL HAMBURGER (3 GARIS) UNTUK HP -->
    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- MENU DROPDOWN -->
    <div class="navbar-menu" id="navbarMenu">
      <button onclick="goDashboard()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Dashboard</span>
      </button>
      <button onclick="goHome()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
        <span>Reset</span>
      </button>
      <button onclick="openPassModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>Laporan</span>
      </button>
    </div>
  </div>
</nav>

<!-- MODAL PASSWORD LAPORAN -->
<div class="modal-overlay" id="passModal">
  <div class="modal-box">
    <h3>Akses Laporan</h3>
    <p>Masukkan kata sandi spreadsheet laporan.</p>
    <input type="password" id="passInput" class="input-password" placeholder="Kata Sandi..." onkeyup="if(event.key==='Enter') verifyPassword()">
    <div class="modal-actions">
      <button class="btn-modal btn-cancel" onclick="closePassModal()">Batal</button>
      <button class="btn-modal btn-submit" onclick="verifyPassword()">Buka</button>
    </div>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-weight:600; font-size: 13px; color:var(--primary-color);">Memproses...</div>
</div>

<div class="container">
  <div class="header-app">
    <h2>Hadirmu</h2>
    <p>Absensi Online TKJ</p>
  </div>
  
  <div class="form-group">
    <label>Pilih Rombongan Belajar</label>
    
    <!-- CUSTOM DROPDOWN -->
    <div class="custom-select-wrapper" id="kelasWrapper">
      <div class="custom-select-trigger" onclick="toggleDropdown()">
        <span id="selectedKelasText">-- Memuat Kelas... --</span>
        <div class="arrow"></div>
      </div>
      <div class="custom-options" id="customOptions"></div>
    </div>
    <input type="hidden" id="selectedKelasValue" value="">
  </div>

  <div id="daftarSiswa"></div>
</div>

<script>
  // =========================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbxIQu0utyRAvlW3LkIicENdVBP-wMp6C65J4_IF9yt0cy7OjOCj2cfmkTYF0u4rWn-V/exec";
  const SPREADSHEET_URL = "https://docs.google.com/spreadsheets/d/1foU4hKjM2QgOqsJbhEZYrjciVamT7LP8-YdUjPeVPfs/edit?gid=1941866150#gid=1941866150";
  const DASHBOARD_URL = "https://itsmuu.github.io";
  const PASS_LAPORAN = "admin123";
  // =========================================================

  const loader = document.getElementById('loading');

  function showLoader(show) {
    loader.style.display = show ? 'flex' : 'none';
  }

  // TOGGLE MOBILE MENU & ANIMASI HAMBURGER
  function toggleMobileMenu() {
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navbarMenu = document.getElementById('navbarMenu');
    
    hamburgerBtn.classList.toggle('active');
    navbarMenu.classList.toggle('open');
  }

  function closeMobileMenu() {
    document.getElementById('hamburgerBtn').classList.remove('active');
    document.getElementById('navbarMenu').classList.remove('open');
  }

  function goDashboard() {
    closeMobileMenu();
    window.location.href = DASHBOARD_URL;
  }

  function goHome() {
    closeMobileMenu();
    document.getElementById('selectedKelasText').innerText = '-- Pilih Kelas --';
    document.getElementById('selectedKelasValue').value = '';
    document.getElementById('daftarSiswa').innerHTML = '';
    document.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
  }

  function openPassModal() {
    closeMobileMenu();
    document.getElementById('passInput').value = '';
    document.getElementById('passModal').style.display = 'flex';
    document.getElementById('passInput').focus();
  }

  function closePassModal() {
    document.getElementById('passModal').style.display = 'none';
  }

  function verifyPassword() {
    const inputPass = document.getElementById('passInput').value;
    if (inputPass === PASS_LAPORAN) {
      closePassModal();
      window.open(SPREADSHEET_URL, '_blank');
    } else {
      alert("❌ Kata sandi salah!");
      document.getElementById('passInput').value = '';
      document.getElementById('passInput').focus();
    }
  }

  function toggleDropdown() {
    document.getElementById('kelasWrapper').classList.toggle('open');
  }

  // Tutup dropdown/menu jika klik di luar area
  window.addEventListener('click', function(e) {
    const kelasWrapper = document.getElementById('kelasWrapper');
    if (kelasWrapper && !kelasWrapper.contains(e.target)) {
      kelasWrapper.classList.remove('open');
    }

    const navbarContainer = document.querySelector('.navbar-container');
    if (navbarContainer && !navbarContainer.contains(e.target)) {
      closeMobileMenu();
    }
  });

  window.onload = function() {
    showLoader(true);
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getDaftarKelas" })
    })
    .then(res => res.json())
    .then(res => {
      showLoader(false);
      const optionsContainer = document.getElementById('customOptions');
      const triggerText = document.getElementById('selectedKelasText');
      optionsContainer.innerHTML = '';

      if (res.status === "success" && res.data.length > 0) {
        triggerText.innerText = "-- Pilih Kelas --";
        
        res.data.forEach(k => {
          const option = document.createElement('div');
          option.className = 'custom-option';
          option.innerText = k;
          option.onclick = function() {
            selectKelas(k, this);
          };
          optionsContainer.appendChild(option);
        });
      } else {
        triggerText.innerText = "Tidak ada kelas ditemukan";
      }
    })
    .catch(err => {
      showLoader(false);
      document.getElementById('selectedKelasText').innerText = "Gagal memuat kelas";
      alert("Gagal terhubung ke API. Cek URL API Apps Script.");
    });
  };

  function selectKelas(kelas, element) {
    document.getElementById('selectedKelasText').innerText = kelas;
    document.getElementById('selectedKelasValue').value = kelas;
    document.getElementById('kelasWrapper').classList.remove('open');

    document.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
    element.classList.add('selected');

    loadSiswa(kelas);
  }

  function loadSiswa(kelas) {
    let container = document.getElementById('daftarSiswa');
    container.innerHTML = '';

    showLoader(true);

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getSiswaByKelas", kelas: kelas })
    })
    .then(res => res.json())
    .then(res => {
      showLoader(false);
      if (res.status === "success") {
        if (res.data.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#7f8c8d; font-size:13px; margin-top:20px;">Tidak ada siswa di kelas ini.</p>';
          return;
        }

        let html = '<div class="daftar-header">Daftar Kehadiran</div>';
        res.data.forEach((nama, index) => {
          html += `
            <div class="siswa-row">
              <div class="nama-siswa-wrapper">
                <span class="nama-siswa-text">${nama}</span>
              </div>
              <div class="status-group">
                <input type="radio" id="h_${index}" name="status_${index}" value="Hadir" checked>
                <label for="h_${index}" title="Hadir">H</label>
                
                <input type="radio" id="s_${index}" name="status_${index}" value="Sakit">
                <label for="s_${index}" title="Sakit">S</label>
                
                <input type="radio" id="i_${index}" name="status_${index}" value="Izin">
                <label for="i_${index}" title="Izin">I</label>
                
                <input type="radio" id="a_${index}" name="status_${index}" value="Alpha">
                <label for="a_${index}" title="Alpha">A</label>
              </div>
              <input type="hidden" class="nama-siswa" value="${nama}">
            </div>
          `;
        });
        html += '<button class="btn-simpan" onclick="kirimAbsensi()">Simpan Absensi Hari Ini</button>';
        container.innerHTML = html;
      }
    });
  }

  function kirimAbsensi() {
    let kelas = document.getElementById('selectedKelasValue').value;
    if (!kelas) {
      alert("Pilih kelas terlebih dahulu!");
      return;
    }

    if (!confirm("Apakah Anda yakin data absensi sudah benar?")) return;

    let rows = document.querySelectorAll('.siswa-row');
    let dataAbsensi = [];

    rows.forEach((row, index) => {
      let nama = row.querySelector('.nama-siswa').value;
      let status = row.querySelector(`input[name="status_${index}"]:checked`).value;
      dataAbsensi.push({ nama: nama, status: status });
    });

    showLoader(true);

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "simpanAbsensi", kelas: kelas, dataAbsensi: dataAbsensi })
    })
    .then(res => res.json())
    .then(res => {
      showLoader(false);
      if (res.status === "success") {
        alert("✔️ " + res.message);
        goHome();
      } else {
        alert("❌ Gagal menyimpan: " + res.message);
      }
    })
    .catch(err => {
      showLoader(false);
      alert("❌ Terjadi kesalahan jaringan.");
    });
  }
</script>

</body>
</html>
