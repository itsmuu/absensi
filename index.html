<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi Siswa</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-nav: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --hover-bg: #f1f5f9;
      --modal-bg: rgba(15, 23, 42, 0.5);
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    [data-theme="dark"] {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-nav: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --hover-bg: #334155;
      --modal-bg: rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    /* Navbar */
    .navbar {
      background-color: var(--bg-nav);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-item {
      text-decoration: none;
      color: var(--text-sub);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
    }

    .nav-item:hover {
      color: var(--primary);
    }

    /* Dropdown Absensi */
    .dropdown {
      position: relative;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: var(--bg-card);
      min-width: 160px;
      box-shadow: var(--shadow-md);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      margin-top: 8px;
    }

    .dropdown-content a {
      color: var(--text-main);
      padding: 10px 16px;
      text-decoration: none;
      display: block;
      font-size: 14px;
    }

    .dropdown-content a:hover {
      background-color: var(--hover-bg);
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Toggle Dark Mode Button */
    .theme-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
    }

    .theme-toggle-btn:hover {
      background-color: var(--hover-bg);
      color: var(--text-main);
    }

    /* Hamburger Menu */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      background: none;
      border: none;
    }

    .hamburger span {
      width: 20px;
      height: 2px;
      background-color: var(--text-main);
      border-radius: 2px;
      transition: 0.3s;
    }

    /* Container Main */
    .container {
      max-width: 800px;
      width: 100%;
      margin: 24px auto 0 auto;
      padding: 0 20px;
    }

    /* Card Box */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    /* Custom Dropdown Kelas */
    .custom-select-wrapper {
      position: relative;
      user-select: none;
    }

    .custom-select-trigger {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-main);
    }

    .custom-select-trigger:after {
      content: '▼';
      font-size: 10px;
      color: var(--text-sub);
    }

    .custom-options {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-top: 4px;
      box-shadow: var(--shadow-md);
      z-index: 10;
      max-height: 200px;
      overflow-y: auto;
    }

    .custom-select-wrapper.open .custom-options {
      display: block;
    }

    .custom-option {
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-main);
    }

    .custom-option:hover {
      background-color: var(--hover-bg);
    }

    .custom-option.selected {
      background-color: var(--primary);
      color: white;
    }

    /* Daftar Siswa */
    .daftar-header {
      margin-top: 24px;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 16px;
      color: var(--text-main);
    }

    .siswa-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .nama-siswa-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nama-siswa-text {
      font-size: 14px;
      font-weight: 500;
    }

    /* Radio Group (H, S, I, A) */
    .status-group {
      display: flex;
      gap: 6px;
    }

    .status-group input[type="radio"] {
      display: none;
    }

    .status-group label {
      display: inline-block;
      width: 32px;
      height: 32px;
      line-height: 32px;
      text-align: center;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .status-group input[value="Hadir"]:checked + label {
      background-color: #10b981;
      color: white;
      border-color: #10b981;
    }

    .status-group input[value="Sakit"]:checked + label {
      background-color: #f59e0b;
      color: white;
      border-color: #f59e0b;
    }

    .status-group input[value="Izin"]:checked + label {
      background-color: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }

    .status-group input[value="Alpha"]:checked + label {
      background-color: #ef4444;
      color: white;
      border-color: #ef4444;
    }

    /* Button Simpan */
    .btn-simpan {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-simpan:hover {
      background-color: var(--primary-hover);
    }

    /* Modal Password */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--modal-bg);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background-color: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: var(--shadow-md);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .modal-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin-bottom: 16px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-cancel {
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      background: none;
      border-radius: 6px;
      color: var(--text-sub);
      cursor: pointer;
    }

    .btn-confirm {
      padding: 8px 14px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Loading Overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--modal-bg);
      z-index: 300;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      flex-direction: column;
      gap: 12px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive Design Mobile */
    @media (max-width: 768px) {
      .hamburger {
        display: flex;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background-color: var(--bg-card);
        border-bottom: 1px solid var(--border-color);
        flex-direction: column;
        align-items: flex-start;
        padding: 16px 20px;
        gap: 12px;
        box-shadow: var(--shadow-md);
      }

      .nav-links.open {
        display: flex;
      }

      .dropdown {
        width: 100%;
      }

      .dropdown-content {
        position: static;
        box-shadow: none;
        border: none;
        margin-top: 4px;
        padding-left: 12px;
      }

      .dropdown.active .dropdown-content {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <div class="logo-area" onclick="goHome()">
        <div class="logo-icon">A</div>
        <div class="logo-text">AbsensiApp</div>
      </div>

      <div class="nav-right">
        <!-- Toggle Dark Mode -->
        <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Theme">
          <svg id="moon-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
          <svg id="sun-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none;"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
        </button>

        <!-- Nav Links -->
        <div class="nav-links" id="navLinks">
          <a class="nav-item" onclick="goHome()">Beranda</a>
          <div class="dropdown" id="absensiDropdown">
            <span class="nav-item" onclick="toggleSubMenu(event)">Absensi ▾</span>
            <div class="dropdown-content">
              <a href="#" onclick="goHome()">Input Absensi</a>
            </div>
          </div>
          <a class="nav-item" onclick="openPassModal()">Laporan</a>
        </div>

        <!-- Hamburger Icon -->
        <button class="hamburger" id="hamburgerBtn" onclick="toggleMobileMenu()" aria-label="Toggle Mobile Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Container Utama -->
  <div class="container">
    <div class="card">
      <div class="card-title">Pilih Kelas</div>

      <!-- Custom Select / Dropdown Kelas -->
      <div class="custom-select-wrapper" id="kelasWrapper">
        <div class="custom-select-trigger" onclick="toggleDropdown()">
          <span id="selectedKelasText">-- Memuat Kelas... --</span>
        </div>
        <div class="custom-options" id="customOptions"></div>
      </div>
      <input type="hidden" id="selectedKelasValue" value="">

      <!-- Container Daftar Siswa -->
      <div id="daftarSiswa"></div>
    </div>
  </div>

  <!-- Modal Password Laporan -->
  <div class="modal-overlay" id="passModal">
    <div class="modal-card">
      <div class="modal-title">Masukkan Password Laporan</div>
      <input type="password" class="modal-input" id="passInput" placeholder="Password">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closePassModal()">Batal</button>
        <button class="btn-confirm" onclick="verifyPassword()">Masuk</button>
      </div>
    </div>
  </div>

  <!-- Indicator Loading -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <span>Memproses...</span>
  </div>

  <!-- Script Logika JavaScript -->
  <script>
    // =========================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbxIQu0utyRAvlW3LkIicENdVBP-wMp6C65J4_IF9yt0cy7OjOCj2cfmkTYF0u4rWn-V/exec";
    const SPREADSHEET_URL = "https://docs.google.com/spreadsheets/d/1foU4hKjM2QgOqsJbhEZYrjciVamT7LP8-YdUjPeVPfs/edit?gid=1941866150#gid=1941866150";
    const PASS_LAPORAN = "admin123";
    const CACHE_EXPIRY = 60 * 60 * 1000; // Cache berlaku 1 jam
    // =========================================================

    // --- DARK / LIGHT MODE ---
    const toggleBtn = document.getElementById('theme-toggle');
    const moonIcon = document.getElementById('moon-icon');
    const sunIcon = document.getElementById('sun-icon');

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
      if (savedTheme === 'dark') {
        moonIcon.style.display = 'none';
        sunIcon.style.display = 'block';
      }
    }

    toggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      let newTheme = currentTheme !== 'dark' ? 'dark' : 'light';

      moonIcon.style.display = newTheme === 'dark' ? 'none' : 'block';
      sunIcon.style.display = newTheme === 'dark' ? 'block' : 'none';

      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    // --- MOBILE MENU ---
    function toggleMobileMenu() {
      document.getElementById('hamburgerBtn').classList.toggle('active');
      document.getElementById('navLinks').classList.toggle('open');
    }

    function closeMobileMenu() {
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const navLinks = document.getElementById('navLinks');
      if (hamburgerBtn) hamburgerBtn.classList.remove('active');
      if (navLinks) navLinks.classList.remove('open');
      document.getElementById('absensiDropdown').classList.remove('active');
    }

    function toggleSubMenu(e) {
      if (window.innerWidth <= 768) {
        e.preventDefault();
        document.getElementById('absensiDropdown').classList.toggle('active');
      }
    }

    const loader = document.getElementById('loading');
    function showLoader(show) {
      loader.style.display = show ? 'flex' : 'none';
    }

    function goHome() {
      closeMobileMenu();
      document.getElementById('selectedKelasText').innerText = '-- Pilih Kelas --';
      document.getElementById('selectedKelasValue').value = '';
      document.getElementById('daftarSiswa').innerHTML = '';
      document.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
    }

    function openPassModal() {
      closeMobileMenu();
      document.getElementById('passInput').value = '';
      document.getElementById('passModal').style.display = 'flex';
      document.getElementById('passInput').focus();
    }

    function closePassModal() {
      document.getElementById('passModal').style.display = 'none';
    }

    function verifyPassword() {
      const inputPass = document.getElementById('passInput').value;
      if (inputPass === PASS_LAPORAN) {
        closePassModal();
        window.open(SPREADSHEET_URL, '_blank');
      } else {
        alert("❌ Kata sandi salah!");
        document.getElementById('passInput').value = '';
        document.getElementById('passInput').focus();
      }
    }

    function toggleDropdown() {
      document.getElementById('kelasWrapper').classList.toggle('open');
    }

    window.addEventListener('click', function(e) {
      const kelasWrapper = document.getElementById('kelasWrapper');
      if (kelasWrapper && !kelasWrapper.contains(e.target)) {
        kelasWrapper.classList.remove('open');
      }

      const navbarContainer = document.querySelector('.navbar-container');
      if (navbarContainer && !navbarContainer.contains(e.target)) {
        closeMobileMenu();
      }
    });

    // --- PROSES AMBIL DAFTAR KELAS (OPTIMASI CACHING & GET) ---
    window.onload = function() {
      const cachedData = localStorage.getItem('daftar_kelas_cache');
      const cacheTime = localStorage.getItem('daftar_kelas_time');
      const now = new Date().getTime();

      // Jika ada cache valid, tampilkan secara instan (0 Detik)
      if (cachedData && cacheTime && (now - cacheTime < CACHE_EXPIRY)) {
        renderKelasOption(JSON.parse(cachedData));
        return;
      }

      fetchKelasFromServer();
    };

    function fetchKelasFromServer() {
      showLoader(true);
      fetch(`${API_URL}?action=getDaftarKelas`)
        .then(res => res.json())
        .then(res => {
          showLoader(false);
          if (res.status === "success" && res.data.length > 0) {
            localStorage.setItem('daftar_kelas_cache', JSON.stringify(res.data));
            localStorage.setItem('daftar_kelas_time', new Date().getTime());
            
            renderKelasOption(res.data);
          } else {
            document.getElementById('selectedKelasText').innerText = "Tidak ada kelas ditemukan";
          }
        })
        .catch(err => {
          showLoader(false);
          document.getElementById('selectedKelasText').innerText = "Gagal memuat kelas";
        });
    }

    function renderKelasOption(daftarKelas) {
      const optionsContainer = document.getElementById('customOptions');
      const triggerText = document.getElementById('selectedKelasText');
      optionsContainer.innerHTML = '';
      triggerText.innerText = "-- Pilih Kelas --";

      daftarKelas.forEach(k => {
        const option = document.createElement('div');
        option.className = 'custom-option';
        option.innerText = k;
        option.onclick = function() {
          selectKelas(k, this);
        };
        optionsContainer.appendChild(option);
      });
    }

    function selectKelas(kelas, element) {
      document.getElementById('selectedKelasText').innerText = kelas;
      document.getElementById('selectedKelasValue').value = kelas;
      document.getElementById('kelasWrapper').classList.remove('open');

      document.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
      element.classList.add('selected');

      loadSiswa(kelas);
    }

    // --- AMBIL DATA SISWA (FAST GET METHOD) ---
    function loadSiswa(kelas) {
      let container = document.getElementById('daftarSiswa');
      container.innerHTML = '';

      showLoader(true);

      fetch(`${API_URL}?action=getSiswaByKelas&kelas=${encodeURIComponent(kelas)}`)
        .then(res => res.json())
        .then(res => {
          showLoader(false);
          if (res.status === "success") {
            if (res.data.length === 0) {
              container.innerHTML = '<p style="text-align:center; color:var(--text-sub); font-size:13px; margin-top:20px;">Tidak ada siswa di kelas ini.</p>';
              return;
            }

            let html = '<div class="daftar-header">Daftar Kehadiran</div>';
            res.data.forEach((nama, index) => {
              html += `
                <div class="siswa-row">
                  <div class="nama-siswa-wrapper">
                    <span class="nama-siswa-text">${nama}</span>
                  </div>
                  <div class="status-group">
                    <input type="radio" id="h_${index}" name="status_${index}" value="Hadir" checked>
                    <label for="h_${index}" title="Hadir">H</label>
                    
                    <input type="radio" id="s_${index}" name="status_${index}" value="Sakit">
                    <label for="s_${index}" title="Sakit">S</label>
                    
                    <input type="radio" id="i_${index}" name="status_${index}" value="Izin">
                    <label for="i_${index}" title="Izin">I</label>
                    
                    <input type="radio" id="a_${index}" name="status_${index}" value="Alpha">
                    <label for="a_${index}" title="Alpha">A</label>
                  </div>
                  <input type="hidden" class="nama-siswa" value="${nama}">
                </div>
              `;
            });
            html += '<button class="btn-simpan" onclick="kirimAbsensi()">Simpan Absensi Hari Ini</button>';
            container.innerHTML = html;
          }
        })
        .catch(err => {
          showLoader(false);
          alert("Gagal memuat data siswa.");
        });
    }

    // --- PROSES SIMPAN ABSENSI (METHOD POST) ---
    function kirimAbsensi() {
      let kelas = document.getElementById('selectedKelasValue').value;
      if (!kelas) {
        alert("Pilih kelas terlebih dahulu!");
        return;
      }

      if (!confirm("Apakah Anda yakin data absensi sudah benar?")) return;

      let rows = document.querySelectorAll('.siswa-row');
      let dataAbsensi = [];

      rows.forEach((row, index) => {
        let nama = row.querySelector('.nama-siswa').value;
        let status = row.querySelector(`input[name="status_${index}"]:checked`).value;
        dataAbsensi.push({ nama: nama, status: status });
      });

      showLoader(true);

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "simpanAbsensi", kelas: kelas, dataAbsensi: dataAbsensi })
      })
      .then(res => res.json())
      .then(res => {
        showLoader(false);
        if (res.status === "success") {
          alert("✔️ " + res.message);
          goHome();
        } else {
          alert("❌ Gagal menyimpan: " + res.message);
        }
      })
      .catch(err => {
        showLoader(false);
        alert("❌ Terjadi kesalahan jaringan.");
      });
    }
  </script>
</body>
</html>
