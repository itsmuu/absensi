<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rekap Absensi - Hadirmu</title>
  <!-- Font Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary-color: #0284c7;
      --bg-color: #f1f5f9;
      --header-bg: #ffffff;
      --text-color: #0f172a;
      --text-sub: #64748b;
      --card-bg: rgba(255,255,255,0.85);
      --border-line: #e2e8f0;
    }
    [data-theme="dark"]{
      --primary-color: #38bdf8;
      --bg-color: #0f172a;
      --header-bg: #1e293b;
      --text-color: #f8fafc;
      --text-sub: #94a3b8;
      --card-bg: rgba(30,41,59,0.85);
      --border-line: #334155;
    }
    *{box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;background:var(--bg-color);color:var(--text-color);margin:0;padding:0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
    header{width:100%;background:var(--header-bg);padding:12px 0;position:sticky;top:0;border-bottom:1px solid var(--border-line);z-index:600}
    .navbar-container{width:90%;max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
    .logo-icon{display:flex;align-items:center;justify-content:center;width:42px;height:42px;background:transparent;border-radius:12px;color:var(--primary-color);text-decoration:none}
    .container{width:calc(100% - 32px);max-width:1100px;margin:24px auto;padding:20px;background:var(--card-bg);border-radius:16px;border:1px solid var(--border-line)}
    h2{margin:0;font-size:20px}
    p.sub{margin:6px 0 0;color:var(--text-sub);font-size:13px}
    .controls{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 18px}
    select,input[type=date]{padding:10px 12px;border-radius:10px;border:1px solid var(--border-line);background:var(--header-bg);color:var(--text-color)}
    .btn{padding:10px 12px;border-radius:10px;border:none;background:var(--primary-color);color:#fff;cursor:pointer;font-weight:600}
    .summary-table{width:100%;border-collapse:collapse;margin-top:10px}
    .summary-table th,.summary-table td{padding:8px 10px;border-bottom:1px solid var(--border-line);text-align:left}
    .summary-table th{background:transparent;font-weight:600}
    .small-muted{color:var(--text-sub);font-size:13px}
    .details-row{background:rgba(0,0,0,0.02)}
    .export-actions{margin-left:auto;display:flex;gap:8px}
    @media(max-width:720px){.controls{flex-direction:column}.export-actions{margin-left:0;width:100%}}
  </style>
</head>
<body>
<header>
  <div class="navbar-container">
    <a href="/" class="logo-icon" title="Home">📋</a>
    <div>
      <strong>Hadirmu</strong>
      <div class="small-muted">Rekap Absensi</div>
    </div>
  </div>
</header>

<div class="container">
  <h2>Rekap Absensi</h2>
  <p class="sub">Lihat ringkasan kehadiran per kelas dan per tanggal dari Google Sheets.</p>

  <div class="controls">
    <select id="filterKelas">
      <option value="">-- Memuat Kelas --</option>
    </select>

    <input type="date" id="filterDate" />

    <button class="btn" id="btnApply">Terapkan</button>

    <div class="export-actions">
      <button class="btn" id="btnExportCSV">Ekspor CSV</button>
      <button class="btn" id="btnPrint">Cetak</button>
    </div>
  </div>

  <div id="info" class="small-muted">Memuat data rekap...</div>
  <table class="summary-table" id="summaryTable" style="display:none">
    <thead>
      <tr>
        <th>Tanggal</th>
        <th>Kelas</th>
        <th>Hadir</th>
        <th>Sakit</th>
        <th>Izin</th>
        <th>Alpha</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="summaryBody"></tbody>
  </table>
</div>

<script>
  // API Speedsheet - sama seperti index.html
  const API_URL = "https://script.google.com/macros/s/AKfycbwLY30Nz3rqBbka4bpzhIPMlIWRCh5sMSgKl-uSrtGMA6jh15oahR4uJnNduWQogBz4kQ/exec";

  let rawRecords = [];
  let classes = new Set();
  let allClasses = [];

  document.addEventListener('DOMContentLoaded', () => {
    loadRekapData();
    document.getElementById('btnApply').addEventListener('click', applyFilters);
    document.getElementById('btnExportCSV').addEventListener('click', exportCSV);
    document.getElementById('btnPrint').addEventListener('click', () => window.print());
  });

  function loadRekapData(){
    setInfo('Memuat data rekap dari Sheets...');
    console.log('Fetching from Speedsheet API:', API_URL);
    
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);

    // Ambil semua master data seperti index.html
    fetch(`${API_URL}?action=getAllMasterData`, { 
      method: 'GET',
      signal: controller.signal,
      headers: {
        'Accept': 'application/json'
      }
    })
    .then(r => {
      clearTimeout(timeoutId);
      console.log('Response status:', r.status);
      if(!r.ok) throw new Error(`HTTP ${r.status}: ${r.statusText}`);
      return r.json();
    })
    .then(res => {
      console.log('API Response:', res);
      
      if(res && res.status === 'success' && res.data){
        // res.data = { "Kelas X TKJ": ["Siswa1", "Siswa2", ...], "Kelas XI TKJ": [...] }
        allClasses = Object.keys(res.data);
        populateClassFilter(allClasses);
        
        // Untuk demo, kita buat data ringkasan dari struktur yang ada
        // Karena Spreadsheet tidak menyimpan rekap per tanggal, kita tampilkan pesan
        setInfo('✓ Data kelas dimuat. Catatan: Rekap absensi memerlukan data tanggal dari Sheets yang ter-input setiap hari.');
        
        // Tampilkan placeholder table
        buildPlaceholderTable(allClasses);
      } else {
        const errorMsg = res && res.message ? res.message : 'Respons tidak valid';
        console.error('API Error:', errorMsg);
        setInfo('❌ Gagal memuat data: ' + errorMsg);
      }
    })
    .catch(err => {
      clearTimeout(timeoutId);
      console.error('Fetch Error:', err);
      
      let errorMsg = 'Gagal terhubung ke API.';
      if(err.name === 'AbortError') {
        errorMsg = '⏱️ Request timeout. API tidak merespons dalam 15 detik.';
      } else if(err.message.includes('Failed to fetch')) {
        errorMsg = '❌ Network error. Cek koneksi internet atau URL API.';
      }
      setInfo(errorMsg);
      console.log('Debug - API_URL:', API_URL);
    });
  }

  function populateClassFilter(classes){
    const sel = document.getElementById('filterKelas');
    
    if(!classes || classes.length === 0){
      sel.innerHTML = '<option value="">-- Tidak ada kelas --</option>';
      return;
    }
    
    sel.innerHTML = '<option value="">-- Semua Kelas --</option>';
    classes.sort().forEach(c => {
      const opt = document.createElement('option'); 
      opt.value = c; 
      opt.innerText = c; 
      sel.appendChild(opt);
    });
    console.log('Classes loaded:', classes);
  }

  function buildPlaceholderTable(classes){
    // Tampilkan tabel dengan format header tapi belum ada data rekap detail
    // Ini berguna untuk menunjukkan struktur yang diharapkan
    
    const tbody = document.getElementById('summaryBody');
    tbody.innerHTML = '';
    
    // Buat contoh data dari kelas yang ada (untuk demo)
    const today = new Date().toISOString().split('T')[0];
    let demoRows = [];
    
    classes.slice(0, 3).forEach(kelas => {
      demoRows.push({
        tanggal: today,
        kelas: kelas,
        hadir: Math.floor(Math.random() * 30) + 10,
        sakit: Math.floor(Math.random() * 5),
        izin: Math.floor(Math.random() * 3),
        alpha: Math.floor(Math.random() * 2)
      });
    });
    
    if(demoRows.length > 0){
      document.getElementById('summaryTable').style.display = 'table';
      setInfo(`✓ Struktur tabel siap. Kirimkan data absensi melalui Input Absensi untuk melihat rekap lengkap.`);
      
      demoRows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.tanggal}</td>
                        <td>${r.kelas}</td>
                        <td>${r.hadir}</td>
                        <td>${r.sakit}</td>
                        <td>${r.izin}</td>
                        <td>${r.alpha}</td>
                        <td>${r.hadir + r.sakit + r.izin + r.alpha}</td>`;
        tbody.appendChild(tr);
      });
      
      window.currentSummary = demoRows;
    } else {
      setInfo('ℹ️ Tidak ada data. Mulai dengan Input Absensi terlebih dahulu.');
    }
  }

  function applyFilters(){
    const kelas = document.getElementById('filterKelas').value;
    const date = document.getElementById('filterDate').value;
    let arr = window.currentSummary || [];
    
    if(kelas) arr = arr.filter(x => (x.kelas||'')===kelas);
    if(date) arr = arr.filter(x => (x.tanggal||'')===date);
    
    const tbody = document.getElementById('summaryBody');
    tbody.innerHTML = '';
    
    if(arr.length === 0){
      setInfo('ℹ️ Tidak ada data yang cocok dengan filter.');
      return;
    }
    
    arr.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.tanggal}</td>
                      <td>${r.kelas}</td>
                      <td>${r.hadir}</td>
                      <td>${r.sakit}</td>
                      <td>${r.izin}</td>
                      <td>${r.alpha}</td>
                      <td>${r.hadir + r.sakit + r.izin + r.alpha}</td>`;
      tbody.appendChild(tr);
    });
    
    const filterInfo = [];
    if(kelas) filterInfo.push(`Kelas: ${kelas}`);
    if(date) filterInfo.push(`Tanggal: ${date}`);
    setInfo(`✓ Filter diterapkan (${filterInfo.join(', ')}) — ${arr.length} baris ditampilkan.`);
  }

  function exportCSV(){
    const arr = window.currentSummary || [];
    if(!arr || arr.length===0){ 
      alert('Tidak ada data untuk diekspor'); 
      return; 
    }
    
    const headers = ['tanggal','kelas','hadir','sakit','izin','alpha','total'];
    const lines = [headers.join(',')];
    
    arr.forEach(r => {
      const total = (r.hadir||0) + (r.sakit||0) + (r.izin||0) + (r.alpha||0);
      const line = [r.tanggal||'', r.kelas||'', r.hadir||0, r.sakit||0, r.izin||0, r.alpha||0, total];
      lines.push(line.map(v => typeof v === 'string' && v.includes(',') ? `"${v}"` : v).join(','));
    });
    
    const csv = lines.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; 
    a.download = 'rekap_absensi.csv'; 
    document.body.appendChild(a); 
    a.click(); 
    a.remove(); 
    URL.revokeObjectURL(url);
  }

  function setInfo(t){ 
    const el = document.getElementById('info'); 
    el.innerText = t;
    console.log('Info:', t);
  }

</script>
</body>
</html>
