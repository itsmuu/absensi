<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rekap Absensi - Hadirmu</title>
  <!-- Font Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary-color: #0284c7;
      --bg-color: #f1f5f9;
      --header-bg: #ffffff;
      --text-color: #0f172a;
      --text-sub: #64748b;
      --card-bg: rgba(255,255,255,0.85);
      --border-line: #e2e8f0;
    }
    [data-theme="dark"]{
      --primary-color: #38bdf8;
      --bg-color: #0f172a;
      --header-bg: #1e293b;
      --text-color: #f8fafc;
      --text-sub: #94a3b8;
      --card-bg: rgba(30,41,59,0.85);
      --border-line: #334155;
    }
    *{box-sizing:border-box}
    body{font-family:'Poppins',sans-serif;background:var(--bg-color);color:var(--text-color);margin:0;padding:0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
    header{width:100%;background:var(--header-bg);padding:12px 0;position:sticky;top:0;border-bottom:1px solid var(--border-line);z-index:600}
    .navbar-container{width:90%;max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
    .logo-icon{display:flex;align-items:center;justify-content:center;width:42px;height:42px;background:transparent;border-radius:12px;color:var(--primary-color);text-decoration:none}
    .container{width:calc(100% - 32px);max-width:1100px;margin:24px auto;padding:20px;background:var(--card-bg);border-radius:16px;border:1px solid var(--border-line)}
    h2{margin:0;font-size:20px}
    p.sub{margin:6px 0 0;color:var(--text-sub);font-size:13px}
    .controls{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 18px}
    select,input[type=date]{padding:10px 12px;border-radius:10px;border:1px solid var(--border-line);background:var(--header-bg);color:var(--text-color)}
    .btn{padding:10px 12px;border-radius:10px;border:none;background:var(--primary-color);color:#fff;cursor:pointer;font-weight:600}
    .summary-table{width:100%;border-collapse:collapse;margin-top:10px}
    .summary-table th,.summary-table td{padding:8px 10px;border-bottom:1px solid var(--border-line);text-align:left}
    .summary-table th{background:transparent;font-weight:600}
    .small-muted{color:var(--text-sub);font-size:13px}
    .details-row{background:rgba(0,0,0,0.02)}
    .export-actions{margin-left:auto;display:flex;gap:8px}
    @media(max-width:720px){.controls{flex-direction:column}.export-actions{margin-left:0;width:100%}}
  </style>
</head>
<body>
<header>
  <div class="navbar-container">
    <a href="/" class="logo-icon" title="Home">📋</a>
    <div>
      <strong>Hadirmu</strong>
      <div class="small-muted">Rekap Absensi</div>
    </div>
  </div>
</header>

<div class="container">
  <h2>Rekap Absensi</h2>
  <p class="sub">Lihat ringkasan kehadiran per kelas dan per tanggal dari Google Sheets.</p>

  <div class="controls">
    <select id="filterKelas">
      <option value="">-- Pilih Kelas untuk Melihat Rekap --</option>
    </select>

    <input type="date" id="filterDate" />

    <button class="btn" id="btnApply">Terapkan Filter</button>

    <div class="export-actions">
      <button class="btn" id="btnExportCSV">Ekspor CSV</button>
      <button class="btn" id="btnPrint">Cetak</button>
    </div>
  </div>

  <div id="info" class="small-muted">Memuat data kelas...</div>
  <table class="summary-table" id="summaryTable" style="display:none">
    <thead>
      <tr>
        <th>Tanggal</th>
        <th>Kelas</th>
        <th>Hadir</th>
        <th>Sakit</th>
        <th>Izin</th>
        <th>Alpha</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="summaryBody"></tbody>
  </table>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwLY30Nz3rqBbka4bpzhIPMlIWRCh5sMSgKl-uSrtGMA6jh15oahR4uJnNduWQogBz4kQ/exec";

  let cacheDataMaster = {};
  let allRekapData = [];

  document.addEventListener('DOMContentLoaded', () => {
    loadClassesData();
    
    // Event listener untuk dropdown kelas
    document.getElementById('filterKelas').addEventListener('change', (e) => {
      const selectedClass = e.target.value;
      if(selectedClass) {
        loadRekapForClass(selectedClass);
      } else {
        document.getElementById('summaryTable').style.display = 'none';
        setInfo('Pilih kelas untuk melihat rekap absensi.');
      }
    });
    
    document.getElementById('btnApply').addEventListener('click', applyFilters);
    document.getElementById('btnExportCSV').addEventListener('click', exportCSV);
    document.getElementById('btnPrint').addEventListener('click', () => window.print());
  });

  function loadClassesData(){
    setInfo('Memuat daftar kelas...');
    console.log('Fetching master data from:', API_URL);
    
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);

    fetch(`${API_URL}?action=getAllMasterData`, { 
      method: 'GET',
      signal: controller.signal,
      headers: { 'Accept': 'application/json' }
    })
    .then(r => {
      clearTimeout(timeoutId);
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then(res => {
      console.log('Master data loaded:', res);
      
      if(res && res.status === 'success' && res.data){
        cacheDataMaster = res.data;
        populateClassFilter(Object.keys(res.data));
        setInfo('✓ Pilih kelas di dropdown untuk melihat rekap absensi.');
      } else {
        setInfo('❌ Gagal memuat data kelas.');
      }
    })
    .catch(err => {
      clearTimeout(timeoutId);
      console.error('Error:', err);
      setInfo('❌ Gagal terhubung ke API.');
    });
  }

  function populateClassFilter(classes){
    const sel = document.getElementById('filterKelas');
    sel.innerHTML = '<option value="">-- Pilih Kelas untuk Melihat Rekap --</option>';
    
    if(!classes || classes.length === 0) return;
    
    classes.sort().forEach(c => {
      const opt = document.createElement('option'); 
      opt.value = c; 
      opt.innerText = c; 
      sel.appendChild(opt);
    });
    console.log('Classes populated:', classes);
  }

  function loadRekapForClass(selectedClass){
    setInfo(`Memuat rekap untuk ${selectedClass}...`);
    console.log('Loading recap for class:', selectedClass);
    
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);

    // Panggil API dengan parameter kelas untuk mendapatkan rekap absensi
    fetch(`${API_URL}?action=getRekapByKelas&kelas=${encodeURIComponent(selectedClass)}`, { 
      method: 'GET',
      signal: controller.signal,
      headers: { 'Accept': 'application/json' }
    })
    .then(r => {
      clearTimeout(timeoutId);
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then(res => {
      console.log('Recap data received:', res);
      
      // Jika API mengembalikan data rekap
      if(res && res.status === 'success' && res.data && Array.isArray(res.data)){
        allRekapData = res.data;
        displayRekapTable(allRekapData, selectedClass);
      } else if(res && res.status === 'success' && res.data && res.data.length === 0){
        // Tidak ada data rekap untuk kelas ini
        setInfo(`ℹ️ Belum ada data absensi untuk kelas ${selectedClass}.`);
        document.getElementById('summaryTable').style.display = 'none';
      } else {
        // API mungkin belum mendukung endpoint ini, tampilkan pesan
        console.warn('API response:', res);
        setInfo(`⚠️ Endpoint getRekapByKelas belum tersedia. Kirimkan absensi di halaman Input terlebih dahulu.`);
        document.getElementById('summaryTable').style.display = 'none';
      }
    })
    .catch(err => {
      clearTimeout(timeoutId);
      console.error('Error loading recap:', err);
      
      // Jika endpoint tidak ada, tampilkan pesan informatif
      setInfo(`ℹ️ Belum ada data rekap untuk kelas ini. Mulai input absensi terlebih dahulu.`);
      document.getElementById('summaryTable').style.display = 'none';
    });
  }

  function displayRekapTable(data, selectedClass){
    const tbody = document.getElementById('summaryBody');
    tbody.innerHTML = '';
    
    if(!data || data.length === 0){
      setInfo(`ℹ️ Tidak ada data absensi untuk ${selectedClass}.`);
      document.getElementById('summaryTable').style.display = 'none';
      return;
    }
    
    document.getElementById('summaryTable').style.display = 'table';
    setInfo(`✓ Menampilkan ${data.length} rekap absensi untuk ${selectedClass}.`);
    
    data.forEach(r => {
      const tr = document.createElement('tr');
      const hadir = r.hadir || 0;
      const sakit = r.sakit || 0;
      const izin = r.izin || 0;
      const alpha = r.alpha || 0;
      const total = hadir + sakit + izin + alpha;
      
      tr.innerHTML = `<td>${r.tanggal || ''}</td>
                      <td>${r.kelas || selectedClass}</td>
                      <td>${hadir}</td>
                      <td>${sakit}</td>
                      <td>${izin}</td>
                      <td>${alpha}</td>
                      <td>${total}</td>`;
      tbody.appendChild(tr);
    });
    
    window.currentSummary = data;
  }

  function applyFilters(){
    const selectedClass = document.getElementById('filterKelas').value;
    const filterDate = document.getElementById('filterDate').value;
    
    if(!selectedClass){
      alert('Pilih kelas terlebih dahulu!');
      return;
    }
    
    let filtered = allRekapData || [];
    
    if(filterDate){
      filtered = filtered.filter(x => (x.tanggal || '') === filterDate);
    }
    
    if(filtered.length === 0){
      setInfo(`ℹ️ Tidak ada data untuk tanggal ${filterDate || 'yang dipilih'}.`);
      document.getElementById('summaryBody').innerHTML = '';
      return;
    }
    
    displayRekapTable(filtered, selectedClass);
  }

  function exportCSV(){
    const data = window.currentSummary || [];
    if(!data || data.length === 0){ 
      alert('Tidak ada data untuk diekspor. Pilih kelas terlebih dahulu.'); 
      return; 
    }
    
    const headers = ['tanggal','kelas','hadir','sakit','izin','alpha','total'];
    const lines = [headers.join(',')];
    
    data.forEach(r => {
      const hadir = r.hadir || 0;
      const sakit = r.sakit || 0;
      const izin = r.izin || 0;
      const alpha = r.alpha || 0;
      const total = hadir + sakit + izin + alpha;
      const line = [r.tanggal || '', r.kelas || '', hadir, sakit, izin, alpha, total];
      lines.push(line.join(','));
    });
    
    const csv = lines.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; 
    a.download = 'rekap_absensi.csv'; 
    document.body.appendChild(a); 
    a.click(); 
    a.remove(); 
    URL.revokeObjectURL(url);
  }

  function setInfo(t){ 
    const el = document.getElementById('info'); 
    el.innerText = t;
    console.log('Info:', t);
  }

</script>
</body>
</html>
